<!DOCTYPE html>
<html>
    <head>
        <title>Volleyball Tracker</title>
        <link rel="stylesheet" href="style.css">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        >
    </head>

    <body>
        <header>
            <nav aria-label="Main navigation">
                <a href="#">Home</a>
                <a href="#">Scoreboard</a>
                <a href="#">Analytics</a>
                <a href="#">More</a>
            </nav>
        </header>
        
        <main>
            <section class="scoreboard">
                <section class="game-info">
                    <input
                        class="team-name-input"
                        id="team-one-name"
                        type="text"
                        value="Team 1"
                    />
                    <section class="timer">
                        <button class="timer-toggle-button" type="button"></button>
                        
                        <input
                            class="timer-input"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            aria-label="timer"
                            placeholder="0:00"
                        >
                        
                        <button class="timer-reset-button" type="button">Reset</button>
                    </section>
                    <input
                        class="team-name-input"
                        id="team-two-name"
                        type="text"
                        value="Team 2"
                    />
                </section>

                <section class="teams">
                    <section class="team team-one" data-team="teamOne">
                        <button class="score-button" type="button"></button>
                        <button class="subtract-button" type="button">-1</button>
                    </section>
                    
                    <section class="team team-two" data-team="teamTwo">
                        <button class="score-button" type="button"></button>
                        <button class="subtract-button" type="button">-1</button>
                    </section>
                </section>

                <section class="set-summary">
                    <section class="set-control" data-team="teamOne">
                        <button class="set-subtract-button" type="button">-1</button>

                        <p>
                            Team 1 Sets: 
                            <span class="team-one-sets"></span>
                        </p>

                        <button class="set-add-button" type="button">+1</button>
                    </section>
                    
                    <section class="set-control">
                        <p>
                            Set: 
                            <span class="current-set"></span>
                        </p>
                    </section>

                    <section class="set-control" data-team="teamTwo">
                        <button class="set-subtract-button" type="button">-1</button>

                        <p>
                            Team 2 Sets: 
                            <span class="team-two-sets"></span>
                        </p>

                        <button class="set-add-button" type="button">+1</button>
                    </section>
                </section>

                <section class="additional-features">
                    <button
                        class="features-toggle-button"
                        type="button"
                        aria-expanded="false"
                    >
                        Additional Features
                    </button>

                    <div class="features-menu" hidden>
                        <button
                            class="reset-scores-button"
                            type="button"
                        >
                            Reset Scores
                        </button>

                        <button
                            class="reset-match-button"
                            type="button"
                        >
                            Reset Match
                        </button>

                        <button
                            class="auto-ruling-button"
                            type="button"
                        >
                        </button>

                        <div class="configure-rules">
                            <button
                                class="configure-rules-button"
                                type="button"
                                aria-expanded="false"
                            >
                                Configure Rules ▲
                            </button>

                            <section
                                class="rules-menu"
                                hidden
                            >
                                <div
                                    class="rule-control"
                                    data-rule="setsToWin"
                                >
                                    <button
                                        class="rule-subtract-button"
                                        type="button"
                                    >
                                        -
                                    </button>

                                    <p>
                                        Sets to Win:
                                        <span class="sets-to-win-display"></span>
                                    </p>

                                    <button
                                        class="rule-add-button"
                                        type="button"
                                    >
                                        +
                                    </button>
                                </div>

                                <div
                                    class="rule-control"
                                    data-rule="setLength"
                                >
                                    <button
                                        class="rule-subtract-button"
                                        type="button"
                                    >
                                        -
                                    </button>

                                    <p>
                                        Set Length:
                                        <span class="set-length-display"></span>
                                    </p>

                                    <button
                                        class="rule-add-button"
                                        type="button"
                                    >
                                        +
                                    </button>
                                </div>

                                <div
                                    class="rule-control"
                                    data-rule="lastSetLength"
                                >
                                    <button
                                        class="rule-subtract-button"
                                        type="button"
                                    >
                                        -
                                    </button>

                                    <p>
                                        Final Set Length:
                                        <span class="last-set-length-display"></span>
                                    </p>

                                    <button
                                        class="rule-add-button"
                                        type="button"
                                    >
                                        +
                                    </button>
                                </div>
                            </section>
                        </div>
                    </div>
                </section>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
