<!DOCTYPE html>
<html>
    <head>
        <title>Volleyball Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Live Scoreboard</h1>

        <header>
            <nav aria-label="Main navigation">
                <a href="#">Home</a>
                <a href="#">Scoreboard</a>
                <a href="#">Analytics</a>
                <a href="#">More</a>
            </nav>
        </header>
        
        <main>
            <section class="scoreboard">
                <section class="game-info">
                    <time datetime="PT0S">0:00</time>
                </section>

                <section class="teams">
                    <section class="team team-one" data-team="teamOne">
                        <h2>Team 1</h2>
                        <button class="score-button" type="button"></button>
                        <button class="subtract-button" type="button">-1</button>
                    </section>
                    
                    <section class="team team-two" data-team="teamTwo">
                        <h2>Team 2</h2>
                        <button class="score-button" type="button"></button>
                        <button class="subtract-button" type="button">-1</button>
                    </section>
                </section>

                <section class="set-summary">
                    <section class="set-control" data-team="teamOne">
                        <button class="set-subtract-button" type="button">-1</button>

                        <p>
                            Team 1 sets:
                            <span class="team-one-sets"></span>
                        </p>

                        <button class="set-add-button" type="button">+1</button>
                    </section>
                    
                    <section class="set-control">
                        <p>
                            Set 
                            <span class="current-set"></span>
                        </p>
                    </section>

                    <section class="set-control" data-team="teamTwo">
                        <button class="set-subtract-button" type="button">-1</button>

                        <p>
                            Team 2 sets:
                            <span class="team-two-sets"></span>
                        </p>

                        <button class="set-add-button" type="button">+1</button>
                    </section>
                </section>

                <label for="additional-features">
                    Additional Features
                </label>

                <select id="additional-features">
                    <option value="">Choose an action</option>
                    <option value="pause">Pause timer</option>
                    <option value="end-set">End set</option>
                    <option value="end-match">End match</option>
                </select>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
