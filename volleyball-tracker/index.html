<!DOCTYPE html>
<html>
    <head>
        <title>Volleyball Tracker</title>
    </head>

    <body>
        <header>
            <h1>Live Scoreboard</h1>
            <time>0:00</time>
        </header>
        
        <main>
            <p>Set 1</p>

            <section>
                <h2>Team 1</h2>
                <p>score</p>
                <button>-1</button>
                <button>+1</button>
                <p>sets won: 0</p>
            </section>

            <section>
                <h2>Team 2</h2>
                <p>score</p>
                <button>-1</button>
                <button>+1</button>
                <p>sets won: 0</p>
            </section>

            <label for="additional-features">
                Additional Features
            </label>

            <select id="additional-features">
                <option>Select a feature</option>
                <option>Pause Timer</option>
                <option>End Set</option>
                <option>End Match</option>
            </select>
        </main>
    </body>
</html>
